# Render Blueprint — deploys the whole stack (Postgres + API + static web).
# Docs: https://render.com/docs/blueprint-spec
databases:
  - name: cms-postgres
    plan: free
    databaseName: cms
    user: cms

services:
  # NestJS API
  - type: web
    name: cms-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @cms/shared build &&
      pnpm --filter @cms/api exec prisma generate &&
      pnpm --filter @cms/api build
    startCommand: >-
      pnpm --filter @cms/api exec prisma migrate deploy &&
      node apps/api/dist/main.js
    healthCheckPath: /api/dashboard/overview
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cms-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: PORT
        value: 4000
      # Set to your deployed web URL, e.g. https://cms-web.onrender.com
      - key: CORS_ORIGIN
        sync: false

  # React static frontend
  - type: web
    name: cms-web
    runtime: static
    rootDir: .
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @cms/web build
    staticPublishPath: apps/web/dist
    envVars:
      # Set to your deployed API URL + /api, e.g. https://cms-api.onrender.com/api
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
